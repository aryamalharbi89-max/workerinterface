<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBox - Scan Locker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        :root{
            --primary:#8ED3F4;
            --navy:#1F3C5A;
            --white:#FFFFFF;
            --gray:#6B6B6B;
            --border:#F1F4F9;
            --bg:#f0f2f5;

            --dark-bg:#121212;
            --dark-frame:#1e1e1e;
            --dark-card:#232323;
            --dark-border:#2f2f2f;
            --dark-text:#f3f4f6;
            --dark-muted:#a7a7a7;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
            -webkit-tap-highlight-color:transparent;
        }

        body{
            background:var(--bg);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100dvh;
            transition:.25s;
        }

        .mobile-frame{
            width:375px;
            height:812px;
            background:var(--white);
            border-radius:40px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow:0 20px 50px rgba(0,0,0,.10);
            position:relative;
        }

        header{
            padding:60px 24px 10px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
        }

        .back-btn{
            width:40px;
            height:40px;
            border-radius:14px;
            border:1px solid var(--border);
            background:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--navy);
            text-decoration:none;
            transition:.15s;
            cursor:pointer;
            flex-shrink:0;
        }

        .back-btn:active{
            transform:scale(.98);
        }

        .header-title{
            flex:1;
            text-align:center;
            font-size:20px;
            font-weight:900;
            color:var(--navy);
        }

        .header-spacer{
            width:40px;
            height:40px;
            flex-shrink:0;
        }

        .content{
            flex:1;
            overflow-y:auto;
            padding:10px 24px 170px;
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
        }

        h1{
            font-size:24px;
            font-weight:900;
            color:var(--navy);
            margin-bottom:12px;
        }

        .sub{
            font-size:13px;
            color:var(--gray);
            font-weight:700;
            margin-bottom:18px;
        }

        .info-card{
            width:100%;
            background:var(--white);
            border-radius:20px;
            padding:18px;
            margin-bottom:18px;
            border:1px solid var(--border);
            box-shadow:0 4px 12px rgba(0,0,0,.03);
            text-align:left;
        }

        .row{
            display:flex;
            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
        }

        .info-box{
            flex:1;
            min-width:120px;
            border:1px solid var(--border);
            border-radius:16px;
            padding:12px;
            background:rgba(142,211,244,.06);
        }

        .k{
            font-size:11px;
            font-weight:900;
            color:var(--gray);
            text-transform:uppercase;
        }

        .v{
            margin-top:6px;
            font-size:14px;
            font-weight:900;
            color:var(--navy);
            word-break:break-word;
        }

        .scanner-wrap{
            width:100%;
            background:var(--white);
            border-radius:24px;
            padding:22px 18px;
            border:1px solid var(--border);
            box-shadow:0 4px 12px rgba(0,0,0,.03);
        }

        .scanner{
            width:250px;
            height:250px;
            margin:0 auto 18px;
            border:4px dashed var(--primary);
            border-radius:24px;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            overflow:hidden;
            background:rgba(142,211,244,.05);
            color:var(--navy);
            font-weight:800;
        }

        .scan-line{
            position:absolute;
            left:0;
            width:100%;
            height:3px;
            background:var(--primary);
            animation:scan 2s infinite;
            box-shadow:0 0 12px rgba(142,211,244,.6);
        }

        @keyframes scan{
            0%{ top:0; opacity:1; }
            50%{ top:calc(100% - 3px); opacity:.3; }
            100%{ top:0; opacity:1; }
        }

        .scanner-label{
            position:relative;
            z-index:2;
            font-size:15px;
            font-weight:900;
        }

        .hint{
            font-size:14px;
            line-height:1.6;
            color:var(--gray);
            font-weight:700;
        }

        .footer-action{
            position:absolute;
            left:16px;
            right:16px;
            bottom:92px;
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:16px;
            background:var(--primary);
            color:#fff;
            font-weight:900;
            font-size:14px;
            cursor:pointer;
            box-shadow:0 8px 20px rgba(142,211,244,.30);
            transition:.15s;
        }

        .btn:active{
            transform:scale(.98);
        }

        .btn.secondary{
            background:transparent;
            color:var(--navy);
            border:1px solid var(--border);
            box-shadow:none;
        }

        .bottom-nav{
            position:absolute;
            left:16px;
            right:16px;
            bottom:16px;
            background:rgba(255,255,255,.92);
            border:1px solid var(--border);
            border-radius:22px;
            padding:10px 8px;
            display:flex;
            justify-content:space-between;
            gap:6px;
            box-shadow:0 12px 28px rgba(31,60,90,.10);
            backdrop-filter:blur(10px);
        }

        .nav-item{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:4px;
            padding:10px 6px;
            border-radius:16px;
            text-decoration:none;
            color:var(--gray);
            font-weight:800;
            font-size:11px;
            transition:.15s;
        }

        .nav-item i{
            font-size:16px;
        }

        .nav-item.active{
            background:rgba(142,211,244,.18);
            color:var(--navy);
            border:1px solid rgba(142,211,244,.25);
        }

        body.dark{
            background:var(--dark-bg);
        }

        body.dark .mobile-frame{
            background:var(--dark-frame);
            box-shadow:0 20px 50px rgba(0,0,0,.35);
        }

        body.dark .back-btn{
            background:var(--dark-card);
            border-color:var(--dark-border);
            color:var(--dark-text);
        }

        body.dark .header-title,
        body.dark h1,
        body.dark .v,
        body.dark .scanner,
        body.dark .scanner-label{
            color:var(--dark-text);
        }

        body.dark .sub,
        body.dark .k,
        body.dark .hint{
            color:var(--dark-muted);
        }

        body.dark .info-card,
        body.dark .scanner-wrap{
            background:var(--dark-card);
            border-color:var(--dark-border);
            box-shadow:0 4px 12px rgba(0,0,0,.25);
        }

        body.dark .info-box{
            background:rgba(255,255,255,.04);
            border-color:var(--dark-border);
        }

        body.dark .scanner{
            background:rgba(255,255,255,.03);
            border-color:rgba(142,211,244,.28);
        }

        body.dark .btn.secondary{
            color:var(--dark-text);
            border-color:var(--dark-border);
        }

        body.dark .bottom-nav{
            background:rgba(35,35,35,.92);
            border-color:var(--dark-border);
        }

        body.dark .nav-item{
            color:var(--dark-muted);
        }

        body.dark .nav-item.active{
            color:var(--dark-text);
            background:rgba(142,211,244,.12);
            border:1px solid rgba(142,211,244,.20);
        }
    </style>

    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="mobile-frame">
        <header>
            <a class="back-btn" href="#" onclick="goBack(); return false;" aria-label="Back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="header-title">Scan Locker</div>
            <div class="header-spacer"></div>
        </header>

        <div class="content">
            <h1>Scanner</h1>
            <div class="sub">Align the QR code within the frame to scan</div>

            <div class="info-card">
                <div class="row">
                    <div class="info-box">
                        <div class="k">Order ID</div>
                        <div class="v" id="orderIdText">#UB-—</div>
                    </div>
                    <div class="info-box">
                        <div class="k">Locker</div>
                        <div class="v" id="lockerIdText">—</div>
                    </div>
                </div>

                <div class="row" style="margin-top:12px;">
                    <div class="info-box">
                        <div class="k">Locker Size</div>
                        <div class="v" id="lockerSizeText">—</div>
                    </div>
                    <div class="info-box">
                        <div class="k">Scan Status</div>
                        <div class="v" id="scanStatusText">Ready</div>
                    </div>
                </div>
            </div>

            <div class="scanner-wrap">
                <div class="scanner">
                    <div class="scan-line"></div>
                    <div class="scanner-label">QR Code Area</div>
                </div>
                <p class="hint">Place the package QR inside the frame, then confirm scanning to continue delivery.</p>
            </div>
        </div>

        <div class="footer-action">
            <button class="btn" onclick="simulateScan()">
                <i class="fa-solid fa-qrcode"></i>
                <span>Scan Package</span>
            </button>
            <button class="btn secondary" onclick="goBack()">Cancel</button>
        </div>

        <nav class="bottom-nav">
            <a class="nav-item" href="home2.html">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a class="nav-item" href="map2.html">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Map</span>
            </a>
            <a class="nav-item active" href="locker-selection2.html">
                <i class="fa-solid fa-box"></i>
                <span>Lockers</span>
            </a>
            <a class="nav-item" href="settings2.html">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order') || "";
        const lockerId = params.get('locker') || "A12";
        const lockerSize = params.get('size') || "M";

        document.getElementById("orderIdText").innerText = orderId ? `#UB-${orderId}` : "#UB-—";
        document.getElementById("lockerIdText").innerText = lockerId;
        document.getElementById("lockerSizeText").innerText = lockerSize;

        function goBack() {
            if (document.referrer && document.referrer !== "") {
                history.back();
            } else if (orderId) {
                window.location.href = `order-details2.html?order=${encodeURIComponent(orderId)}`;
            } else {
                window.location.href = "home2.html";
            }
        }

        function simulateScan() {
            document.getElementById("scanStatusText").innerText = "Scanning...";

            setTimeout(() => {
                document.getElementById("scanStatusText").innerText = "Scanned";
                alert(`Scanning locker ${lockerId} completed successfully.`);

                if (orderId) {
                    location.href = `success2.html?order=${encodeURIComponent(orderId)}&locker=${encodeURIComponent(lockerId)}&size=${encodeURIComponent(lockerSize)}`;
                } else {
                    location.href = `success2.html?locker=${encodeURIComponent(lockerId)}&size=${encodeURIComponent(lockerSize)}`;
                }
            }, 1400);
        }
    </script>

    <script>
    if(localStorage.getItem("unibox_dark_mode") === "1"){
        document.body.classList.add("dark");
    }
    </script>
</body>
</html>
