<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniBox - Select Locker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root{
      --primary:#8ED3F4;
      --navy:#1F3C5A;
      --white:#FFFFFF;
      --gray:#6B6B6B;
      --border:#F1F4F9;
      --bg:#f0f2f5;

      --available-bg:#E1F5FE;
      --occupied-bg:#F5F5F5;
      --selected-bg:#D7F4E4;

      --dark-bg:#121212;
      --dark-frame:#1e1e1e;
      --dark-card:#232323;
      --dark-border:#2f2f2f;
      --dark-text:#f3f4f6;
      --dark-muted:#a7a7a7;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      background:var(--bg);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100dvh;
      transition:.25s;
    }

    .mobile-frame{
      width:375px;
      height:812px;
      background:var(--white);
      border-radius:40px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 20px 50px rgba(0,0,0,.10);
      position:relative;
    }

    header{
      padding:60px 24px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .back-btn{
      width:40px;
      height:40px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--navy);
      text-decoration:none;
      transition:.15s;
      cursor:pointer;
      flex-shrink:0;
    }
    .back-btn:active{transform:scale(.98)}

    .header-title{
      flex:1;
      text-align:center;
      font-size:20px;
      font-weight:900;
      color:var(--navy);
    }

    .header-side{
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--navy);
      font-size:13px;
      font-weight:800;
      text-decoration:none;
      flex-shrink:0;
      cursor:pointer;
    }

    .content{
      flex:1;
      overflow-y:auto;
      padding:10px 24px 92px;
    }

    .section-title{
      font-size:13px;
      font-weight:900;
      color:var(--gray);
      margin:15px 0 10px;
    }

    .card{
      background:var(--white);
      border-radius:20px;
      padding:18px;
      margin-bottom:15px;
      border:1px solid var(--border);
      box-shadow:0 4px 12px rgba(0,0,0,.03);
    }

    .subline{
      background:rgba(245,233,219,.35);
      border:1px solid rgba(245,233,219,.7);
      padding:14px;
      border-radius:16px;
      font-size:13px;
      line-height:1.55;
      color:var(--navy);
      font-weight:800;
      margin-bottom:15px;
    }

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .info-box{
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      background:rgba(142,211,244,.06);
    }

    .k{
      font-size:11px;
      font-weight:900;
      color:var(--gray);
      text-transform:uppercase;
    }

    .v{
      margin-top:6px;
      font-size:14px;
      font-weight:900;
      color:var(--navy);
      word-break:break-word;
    }

    .chips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:15px;
    }

    .chip{
      font-size:12px;
      font-weight:900;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(142,211,244,.25);
      background:rgba(142,211,244,.10);
      color:var(--navy);
    }

    .chip.active{
      background:rgba(142,211,244,.22);
      border-color:rgba(142,211,244,.40);
    }

    .locker-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }

    .locker{
      min-height:84px;
      border-radius:18px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.15s;
      border:1px solid rgba(142,211,244,.30);
      user-select:none;
      position:relative;
      background:var(--available-bg);
      box-shadow:0 4px 12px rgba(0,0,0,.03);
      text-align:center;
      padding:10px 6px;
    }

    .locker:active{transform:scale(.98)}

    .locker.selected{
      border:2px solid #22c55e;
      background:var(--selected-bg);
      box-shadow:0 8px 20px rgba(34,197,94,.18);
    }

    .locker.occupied{
      background:var(--occupied-bg);
      cursor:not-allowed;
      opacity:.7;
      border-color:var(--border);
    }

    .locker-id{
      font-size:15px;
      font-weight:900;
      color:var(--navy);
    }

    .locker-size{
      margin-top:4px;
      font-size:11px;
      font-weight:900;
      color:var(--navy);
    }

    .mini{
      margin-top:4px;
      font-size:10px;
      font-weight:800;
      color:var(--gray);
    }

    .footer-action{
      position:absolute;
      left:16px;
      right:16px;
      bottom:92px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:16px;
      background:var(--primary);
      color:#fff;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(142,211,244,.30);
      transition:.15s;
    }
    .btn:active{transform:scale(.98)}

    .btn.secondary{
      background:transparent;
      color:var(--navy);
      border:1px solid var(--border);
      box-shadow:none;
    }

    .bottom-nav{
      position:absolute;
      left:16px;
      right:16px;
      bottom:16px;
      z-index:9999;
      background:rgba(255,255,255,.92);
      border:1px solid var(--border);
      border-radius:22px;
      padding:10px 8px;
      display:flex;
      justify-content:space-between;
      gap:6px;
      box-shadow:0 12px 28px rgba(31,60,90,.10);
      backdrop-filter:blur(10px);
    }

    .nav-item{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      padding:10px 6px;
      border-radius:16px;
      text-decoration:none;
      color:var(--gray);
      font-weight:800;
      font-size:11px;
      transition:.15s;
    }

    .nav-item i{font-size:16px}
    .nav-item:active{transform:scale(.98)}

    .nav-item.active{
      background:rgba(142,211,244,.18);
      color:var(--navy);
      border:1px solid rgba(142,211,244,.25);
    }

    body.dark{background:var(--dark-bg)}
    body.dark .mobile-frame{background:var(--dark-frame);box-shadow:0 20px 50px rgba(0,0,0,.35)}
    body.dark .back-btn{background:var(--dark-card);border-color:var(--dark-border);color:var(--dark-text)}
    body.dark .header-title,
    body.dark .v,
    body.dark .locker-id,
    body.dark .locker-size{color:var(--dark-text)}
    body.dark .header-side,
    body.dark .section-title,
    body.dark .k,
    body.dark .mini{color:var(--dark-muted)}
    body.dark .card{background:var(--dark-card);border-color:var(--dark-border);box-shadow:0 4px 12px rgba(0,0,0,.25)}
    body.dark .subline{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.10);color:var(--dark-text)}
    body.dark .info-box{background:rgba(255,255,255,.04);border-color:var(--dark-border)}
    body.dark .chip{background:rgba(142,211,244,.12);border-color:rgba(142,211,244,.24);color:var(--dark-text)}
    body.dark .chip.active{background:rgba(142,211,244,.18)}
    body.dark .locker{
      background:rgba(142,211,244,.12);
      border-color:rgba(142,211,244,.25);
      box-shadow:0 4px 12px rgba(0,0,0,.20);
    }
    body.dark .locker.occupied{
      background:rgba(255,255,255,.05);
      border-color:var(--dark-border);
      opacity:.8;
    }
    body.dark .locker.selected{
      background:rgba(34,197,94,.18);
      border-color:rgba(34,197,94,.55);
    }
    body.dark .btn.secondary{color:var(--dark-text);border-color:var(--dark-border)}
    body.dark .bottom-nav{background:rgba(35,35,35,.92);border-color:var(--dark-border)}
    body.dark .nav-item{color:var(--dark-muted)}
    body.dark .nav-item.active{color:var(--dark-text);background:rgba(142,211,244,.12);border:1px solid rgba(142,211,244,.20)}
  </style>

  <link rel="stylesheet" href="theme.css">
</head>

<body>
  <div class="mobile-frame">

    <header>
      <a class="back-btn" href="#" onclick="goBack(); return false;" aria-label="Back">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div class="header-title">Select Locker</div>
      <a class="header-side" href="#" onclick="openHelp(); return false;">Help</a>
    </header>

    <div class="content">
      <div class="section-title">Order & Locker Match</div>

      <div class="subline" id="subLine">
        Choose an available locker that matches your parcel size.
      </div>

      <div class="card">
        <div class="info-grid">
          <div class="info-box">
            <div class="k">Order</div>
            <div class="v" id="orderLabel">Demo Order</div>
          </div>
          <div class="info-box">
            <div class="k">Required Size</div>
            <div class="v" id="requiredSizeLabel">M</div>
          </div>
        </div>
      </div>

      <div class="section-title">Allowed Locker Sizes</div>
      <div class="chips" id="allowedSizesWrap"></div>

      <div class="section-title">Available Lockers</div>
      <div class="card">
        <div class="locker-grid" id="lockerGrid"></div>
      </div>
    </div>

    <div class="footer-action">
      <button class="btn" id="continueBtn" onclick="confirmSelectedLocker()">Continue with Selected Locker</button>
      <button class="btn secondary" onclick="location.href='map2.html'">Open Map</button>
    </div>

    <nav class="bottom-nav">
      <a class="nav-item" href="home2.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a class="nav-item" href="map2.html">
        <i class="fa-solid fa-map-location-dot"></i>
        <span>Map</span>
      </a>
      <a class="nav-item active" href="locker-selection2.html">
        <i class="fa-solid fa-box"></i>
        <span>Lockers</span>
      </a>
      <a class="nav-item" href="profile2.html">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <script>
    function goBack() {
      if (document.referrer && document.referrer !== "") {
        history.back();
      } else {
        location.href = "home2.html";
      }
    }

    const params = new URLSearchParams(location.search);
    const orderId = params.get("order");

    function openHelp() {
      if (orderId) {
        location.href = `help2.html?from=locker&order=${encodeURIComponent(orderId)}`;
      } else {
        location.href = "help2.html?from=locker";
      }
    }

    let selectedLockerId = null;
    let selectedLockerSize = null;

    function normalizeSize(size) {
      const s = String(size || "").trim().toUpperCase();
      if (["S", "SMALL"].includes(s)) return "S";
      if (["M", "MEDIUM"].includes(s)) return "M";
      if (["L", "LARGE"].includes(s)) return "L";
      return "M";
    }

    function getAllowedSizes(parcelSize) {
      const size = normalizeSize(parcelSize);
      if (size === "S") return ["S", "M", "L"];
      if (size === "M") return ["M", "L"];
      return ["L"];
    }

    function getOrderData(orderId) {
      let order = null;

      try {
        if (window.UniBox && typeof UniBox.getOrderById === "function" && orderId) {
          order = UniBox.getOrderById(orderId);
        }
      } catch (e) {}

      if (order) {
        return {
          id: order.id || orderId,
          size: normalizeSize(order.size),
          zone: order.lockerZone || "A"
        };
      }

      return {
        id: orderId || "Demo",
        size: "S",
        zone: "A"
      };
    }

    function generateManyLockers() {
      const rows = ["A", "B", "C", "D", "E", "F", "G", "H", "I"];
      const sizesByRow = {
        A: "S", B: "S", C: "S",
        D: "M", E: "M", F: "M",
        G: "L", H: "L", I: "L"
      };

      const data = [];

      rows.forEach(row => {
        for (let i = 1; i <= 8; i++) {
          const random = Math.random();
          const status = random > 0.28 ? "Available" : "Occupied";

          data.push({
            id: row + i,
            row,
            size: sizesByRow[row],
            status
          });
        }
      });

      return data;
    }

    const orderData = getOrderData(orderId);
    const requiredSize = normalizeSize(orderData.size);
    const allowedSizes = getAllowedSizes(requiredSize);
    const lockers = generateManyLockers();

    document.getElementById("orderLabel").innerText =
      orderData.id === "Demo" ? "Demo Order" : `#UB-${orderData.id}`;
    document.getElementById("requiredSizeLabel").innerText = requiredSize;

    const allowedWrap = document.getElementById("allowedSizesWrap");
    allowedSizes.forEach(size => {
      const chip = document.createElement("div");
      chip.className = "chip active";
      chip.innerText = size;
      allowedWrap.appendChild(chip);
    });

    function renderLockers() {
      const gridEl = document.getElementById("lockerGrid");
      gridEl.innerHTML = "";

      const filtered = lockers.filter(locker => allowedSizes.includes(locker.size));

      filtered.forEach(locker => {
        const div = document.createElement("div");
        div.className = `locker ${locker.status.toLowerCase()}`;
        div.innerHTML = `
          <span class="locker-id">${locker.id}</span>
          <span class="locker-size">${locker.size}</span>
          <span class="mini">${locker.status}</span>
        `;

        if (locker.status === "Available") {
          div.addEventListener("click", () => selectLocker(locker.id, locker.size, div));
        }

        gridEl.appendChild(div);
      });

      document.getElementById("subLine").innerText =
        `Parcel size is ${requiredSize}. You can choose lockers: ${allowedSizes.join(" / ")}. Occupied lockers cannot be selected.`;
    }

    function selectLocker(lockerId, lockerSize, element) {
      selectedLockerId = lockerId;
      selectedLockerSize = lockerSize;

      document.querySelectorAll(".locker").forEach(locker => {
        locker.classList.remove("selected");
      });

      element.classList.add("selected");

      document.getElementById("subLine").innerText =
        `Selected locker ${lockerId} (${lockerSize}). Press continue to proceed.`;
    }

    function confirmSelectedLocker() {
      if (!selectedLockerId) {
        alert("Please select an available locker first.");
        return;
      }

      const ok = confirm(`Do you want to continue with locker ${selectedLockerId} (${selectedLockerSize})?`);
      if (!ok) return;

      if (orderId) {
        window.location.href =
          `scan2.html?order=${encodeURIComponent(orderId)}&locker=${encodeURIComponent(selectedLockerId)}&size=${encodeURIComponent(selectedLockerSize)}`;
      } else {
        window.location.href =
          `scan2.html?locker=${encodeURIComponent(selectedLockerId)}&size=${encodeURIComponent(selectedLockerSize)}`;
      }
    }

    renderLockers();
  </script>

  <script>
  if(localStorage.getItem("unibox_dark_mode") === "1"){
      document.body.classList.add("dark");
  }
  </script>
</body>
</html>
