<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBox - Success 2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root{
      --primary:#8ED3F4;
      --navy:#1F3C5A;
      --white:#ffffff;
      --gray:#6B6B6B;
      --border:#F1F4F9;
      --bg:#f0f2f5;
      --bg-gray:#f8fafc;

      --dark-bg:#121212;
      --dark-frame:#1e1e1e;
      --dark-card:#232323;
      --dark-border:#2f2f2f;
      --dark-text:#f3f4f6;
      --dark-muted:#a7a7a7;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      background:var(--bg);
      color:var(--navy);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100dvh;
      transition:.25s;
    }

    .mobile-frame{
      width:375px;
      height:812px;
      background:var(--white);
      border-radius:40px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 20px 50px rgba(0,0,0,.10);
      position:relative;
    }

    header{
      padding:60px 24px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .header-spacer{
      width:40px;
      height:40px;
      flex-shrink:0;
    }

    .header-title{
      flex:1;
      text-align:center;
      font-size:20px;
      font-weight:900;
      color:var(--navy);
    }

    .content{
      flex:1;
      overflow-y:auto;
      padding:20px 24px 170px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }

    .success-icon{
      width:110px;
      height:110px;
      border-radius:50%;
      background:rgba(142,211,244,.18);
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:46px;
      margin:30px 0 20px;
      box-shadow:0 10px 25px rgba(142,211,244,.25);
    }

    h1{
      font-size:26px;
      font-weight:900;
      color:var(--navy);
      margin-bottom:14px;
    }

    .sub{
      font-size:14px;
      color:var(--gray);
      font-weight:700;
      line-height:1.7;
      margin-bottom:20px;
    }

    .badge{
      background:#f1f5f9;
      color:var(--navy);
      padding:10px 18px;
      border-radius:999px;
      margin-bottom:12px;
      font-size:14px;
      font-weight:900;
      border:1px solid var(--border);
      display:inline-block;
    }

    .details-card{
      width:100%;
      background:var(--white);
      border:1px solid var(--border);
      border-radius:20px;
      padding:18px;
      box-shadow:0 4px 12px rgba(0,0,0,.03);
      margin-top:8px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .info-box{
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      background:rgba(142,211,244,.06);
      text-align:left;
    }

    .k{
      font-size:11px;
      font-weight:900;
      color:var(--gray);
      text-transform:uppercase;
    }

    .v{
      margin-top:6px;
      font-size:14px;
      font-weight:900;
      color:var(--navy);
      word-break:break-word;
    }

    .footer-action{
      position:absolute;
      left:16px;
      right:16px;
      bottom:92px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .primary-btn{
      width:100%;
      background:var(--primary);
      color:white;
      border:none;
      padding:14px;
      border-radius:16px;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(142,211,244,.30);
      transition:.15s;
    }

    .primary-btn:active{
      transform:scale(.98);
    }

    .secondary-btn{
      width:100%;
      background:transparent;
      color:var(--navy);
      border:1px solid var(--border);
      padding:14px;
      border-radius:16px;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
    }

    .bottom-nav{
      position:absolute;
      left:16px;
      right:16px;
      bottom:16px;
      background:rgba(255,255,255,.92);
      border:1px solid var(--border);
      border-radius:22px;
      padding:10px 8px;
      display:flex;
      justify-content:space-between;
      gap:6px;
      box-shadow:0 12px 28px rgba(31,60,90,.10);
      backdrop-filter:blur(10px);
      z-index:9999;
    }

    .nav-item{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      padding:10px 6px;
      border-radius:16px;
      text-decoration:none;
      color:var(--gray);
      font-weight:800;
      font-size:11px;
      transition:.15s;
    }

    .nav-item i{
      font-size:16px;
    }

    .nav-item.active{
      background:rgba(142,211,244,.18);
      color:var(--navy);
      border:1px solid rgba(142,211,244,.25);
    }

    body.dark{
      background:var(--dark-bg);
    }

    body.dark .mobile-frame{
      background:var(--dark-frame);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }

    body.dark .header-title,
    body.dark h1,
    body.dark .v{
      color:var(--dark-text);
    }

    body.dark .sub,
    body.dark .k{
      color:var(--dark-muted);
    }

    body.dark .badge{
      background:rgba(255,255,255,.05);
      border-color:var(--dark-border);
      color:var(--dark-text);
    }

    body.dark .details-card{
      background:var(--dark-card);
      border-color:var(--dark-border);
      box-shadow:0 4px 12px rgba(0,0,0,.25);
    }

    body.dark .info-box{
      background:rgba(255,255,255,.04);
      border-color:var(--dark-border);
    }

    body.dark .secondary-btn{
      color:var(--dark-text);
      border-color:var(--dark-border);
    }

    body.dark .bottom-nav{
      background:rgba(35,35,35,.92);
      border-color:var(--dark-border);
    }

    body.dark .nav-item{
      color:var(--dark-muted);
    }

    body.dark .nav-item.active{
      color:var(--dark-text);
      background:rgba(142,211,244,.12);
      border:1px solid rgba(142,211,244,.20);
    }
  </style>

  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="mobile-frame">

    <header>
      <div class="header-spacer"></div>
      <div class="header-title">Success</div>
      <div class="header-spacer"></div>
    </header>

    <div class="content">
      <div class="success-icon">
        <i class="fa-solid fa-check"></i>
      </div>

      <h1>Package Delivered Successfully!</h1>
      <div class="sub">
        The package has been scanned and confirmed successfully.
      </div>

      <div class="badge" id="lockerBadge">Compartment #A12</div>
      <div class="badge" id="sizeBadge">Size M</div>

      <div class="details-card">
        <div class="row">
          <div class="info-box">
            <div class="k">Order ID</div>
            <div class="v" id="orderIdText">#UB-—</div>
          </div>
          <div class="info-box">
            <div class="k">Locker</div>
            <div class="v" id="lockerIdText">A12</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-action">
      <button class="primary-btn" onclick="goHome()">Back to Home</button>
      <button class="secondary-btn" onclick="goToProfile()">Open Profile</button>
    </div>

    <nav class="bottom-nav">
      <a class="nav-item active" href="home2.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a class="nav-item" href="map2.html">
        <i class="fa-solid fa-map-location-dot"></i>
        <span>Map</span>
      </a>
      <a class="nav-item" href="locker-selection2.html">
        <i class="fa-solid fa-box"></i>
        <span>Lockers</span>
      </a>
      <a class="nav-item" href="profile2.html">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order") || "";
    const lockerId = params.get("locker") || "A12";
    const lockerSize = params.get("size") || "M";

    document.getElementById("lockerBadge").innerText = `Compartment #${lockerId}`;
    document.getElementById("sizeBadge").innerText = `Size ${lockerSize}`;
    document.getElementById("lockerIdText").innerText = lockerId;
    document.getElementById("orderIdText").innerText = orderId ? `#UB-${orderId}` : "#UB-—";

    function goHome() {
      window.location.href = "home2.html";
    }

    function goToProfile() {
      window.location.href = "profile2.html";
    }
  </script>

  <script>
  if(localStorage.getItem("unibox_dark_mode") === "1"){
      document.body.classList.add("dark");
  }
  </script>
</body>
</html>
